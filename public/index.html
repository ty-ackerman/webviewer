<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Channel Picker</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        background: #0f0f0f;
        color: #fff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, "Helvetica Neue", sans-serif;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      header {
        padding: 1rem;
        background: #090909;
        border-bottom: 1px solid #151515;
        font-size: 1rem;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      #viewTabs {
        display: flex;
        gap: 0.5rem;
        padding: 0 1rem;
        margin-top: 0.5rem;
      }

      .viewTab {
        flex: 0 0 auto;
        border-radius: 999px;
        background: #151515;
        color: #cfcfcf;
        border: 1px solid #242424;
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.01em;
        cursor: pointer;
        transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
      }

      .viewTab.active {
        background: #5b8bff;
        border-color: #6e9aff;
        color: #fff;
      }

      #layout {
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 1rem;
        padding: 1rem;
      }

      @media (min-width: 900px) {
        #layout {
          grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
          align-items: start;
        }
      }

      .card {
        background: #111;
        border: 1px solid #1f1f1f;
        border-radius: 12px;
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6);
        padding: 1rem;
      }

      #playerCard {
        padding: 1rem;
        background: #050505;
      }

      #playerWrapper {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #1a1a1a;
      }

      #playerFrame {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }

      .hiddenFrame {
        display: none !important;
      }

      #streamPlayer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
        display: flex;
        align-items: stretch;
        justify-content: center;
      }

      #streamPlayer iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* Ad blocking overlays - blocks clicks on common ad positions */
      .adBlockOverlay {
        position: absolute;
        background: transparent;
        z-index: 10;
        pointer-events: auto;
      }

      /* Top banner ad blocker */
      .adBlockTop {
        top: 0;
        left: 0;
        right: 0;
        height: 60px;
      }

      /* Bottom banner ad blocker */
      .adBlockBottom {
        bottom: 0;
        left: 0;
        right: 0;
        height: 50px;
      }

      /* Corner ad blockers */
      .adBlockTopLeft {
        top: 0;
        left: 0;
        width: 120px;
        height: 120px;
      }

      .adBlockTopRight {
        top: 0;
        right: 0;
        width: 120px;
        height: 120px;
      }

      .adBlockBottomLeft {
        bottom: 0;
        left: 0;
        width: 120px;
        height: 120px;
      }

      .adBlockBottomRight {
        bottom: 0;
        right: 0;
        width: 150px;
        height: 150px;
      }

      /* Center click-through zone - allows video controls */
      .adBlockCenter {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 70%;
        height: 60%;
        pointer-events: none;
        z-index: 11;
      }

      #overlayTitle {
        position: absolute;
        left: 1rem;
        top: 1rem;
        right: 1rem;
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.4;
        color: #fff;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.9);
        background: rgba(0, 0, 0, 0.4);
        border-radius: 6px;
        padding: 0.6rem 0.75rem;
        max-width: 90%;
      }

      #playerActions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
        font-size: 0.82rem;
        color: #a3a3a3;
      }

      button,
      input[type="text"] {
        font-family: inherit;
      }

      input[type="text"] {
        width: 100%;
        border-radius: 8px;
        border: 1px solid #444;
        background: #000;
        padding: 0.65rem 0.75rem;
        font-size: 0.9rem;
        color: #fff;
        outline: none;
        margin-bottom: 0.75rem;
      }

      input[type="text"]:focus {
        border-color: #5b8bff;
      }

      button {
        border: 0;
        border-radius: 8px;
        background: #5b8bff;
        color: #fff;
        font-size: 0.85rem;
        font-weight: 600;
        padding: 0.6rem 0.85rem;
        cursor: pointer;
        transition: transform 0.1s ease;
      }

      button:active {
        transform: scale(0.97);
      }

      button.secondary {
        background: #232323;
        color: #d4d4d4;
      }

      .statusLine {
        font-size: 0.8rem;
        min-height: 1.2rem;
        color: #9ef59e;
        margin-bottom: 1rem;
        word-break: break-word;
      }

      .hidden {
        display: none !important;
      }

      textarea {
        width: 100%;
        min-height: 130px;
        border-radius: 8px;
        border: 1px solid #444;
        background: #000;
        padding: 0.65rem 0.75rem;
        font-size: 0.9rem;
        color: #fff;
        outline: none;
        margin-bottom: 0.75rem;
        resize: vertical;
        font-family: inherit;
      }

      textarea:focus {
        border-color: #5b8bff;
      }

      .panelTitle {
        font-size: 0.85rem;
        font-weight: 600;
        color: #d4d4d4;
        margin-bottom: 0.6rem;
        letter-spacing: 0.01em;
        text-transform: uppercase;
      }

      .helperText {
        font-size: 0.72rem;
        color: #9a9a9a;
        margin-top: -0.3rem;
        margin-bottom: 0.8rem;
      }

      .buttonRow {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin-bottom: 0.75rem;
      }

      .toggleRow {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: #cfcfcf;
        margin-bottom: 0.75rem;
      }

      .toggleRow input[type="checkbox"] {
        width: 1rem;
        height: 1rem;
        background: #000;
        border: 1px solid #444;
        border-radius: 3px;
      }

      .streamInfoLine {
        font-size: 0.7rem;
        color: #a0a0a0;
        margin-top: 0.35rem;
      }

      .videoListItem {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.6rem;
        padding: 0.7rem 0.85rem;
        background: #0b0b0b;
        border-radius: 9px;
        border: 1px solid #1f1f1f;
        margin-bottom: 0.55rem;
      }

      .videoMeta {
        flex: 1 1 auto;
        min-width: 220px;
      }

      .videoTitle {
        font-size: 0.9rem;
        font-weight: 600;
        line-height: 1.4;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        flex-wrap: wrap;
      }

      .currentTag {
        font-size: 0.7rem;
        color: #9ef59e;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid #2a2a2a;
        border-radius: 5px;
        padding: 0.2rem 0.45rem;
        font-weight: 600;
        line-height: 1.2;
      }

      .videoUrl {
        font-size: 0.7rem;
        color: #8b8b8b;
        line-height: 1.3;
        word-break: break-all;
        margin-top: 0.2rem;
      }

      .actions {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .actions button.selectBtn {
        background: #4ade80;
        color: #000;
      }

      .actions button.deleteBtn {
        background: #ef4444;
        color: #fff;
      }

      .emptyState {
        color: #777;
        font-size: 0.8rem;
        border: 1px dashed #2b2b2b;
        border-radius: 8px;
        padding: 0.9rem;
        text-align: center;
      }

      /* Today's NBA Games Grid */
      .gamesGrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .gameCard {
        background: #0b0b0b;
        border: 1px solid #1f1f1f;
        border-radius: 8px;
        padding: 0.7rem;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        text-align: center;
      }

      .gameCard:hover {
        background: #151515;
        border-color: #333;
      }

      .gameCard:active {
        transform: scale(0.97);
      }

      .gameCard.playing {
        border-color: #4ade80;
        background: #0a1a0f;
      }

      /* Game started over 3 hours ago - likely finished or ending */
      .gameCard.gameLate {
        border-color: #ef4444;
        background: #1a0a0a;
      }

      /* Game started within last 3 hours - likely in progress */
      .gameCard.gameLive {
        border-color: #22c55e;
        background: #0a1a0f;
      }

      .gameTeams {
        font-size: 0.85rem;
        font-weight: 600;
        color: #fff;
        line-height: 1.3;
      }

      .gameAt {
        font-size: 0.7rem;
        color: #777;
        margin: 0.2rem 0;
      }

      .gamesDate {
        font-size: 0.75rem;
        color: #888;
        margin-bottom: 0.5rem;
      }

      .noGames {
        color: #666;
        font-size: 0.8rem;
        text-align: center;
        padding: 1rem;
        border: 1px dashed #2b2b2b;
        border-radius: 8px;
      }

      .gameTime {
        font-size: 0.65rem;
        color: #5b8bff;
        margin-top: 0.3rem;
        font-weight: 500;
      }
    </style>
    <script>
      // Basic popup hardening with whitelist
      (function () {
        const originalOpen = window.open;
        const SAFE_HOSTS = new Set(["ppv.to", "www.ppv.to"]);

        window.open = function (url, ...rest) {
          try {
            const parsed = new URL(typeof url === "string" ? url : "", window.location.href);
            if (SAFE_HOSTS.has(parsed.hostname.toLowerCase())) {
              return originalOpen.call(window, parsed.toString(), ...rest);
            }
          } catch {
            // fall through to block
          }
          console.warn("Popup blocked:", url);
          return null;
        };

        document.addEventListener(
          "click",
          function (e) {
            const t = e.target.closest("a");
            if (!t) return;

            const target = (t.target || "").toLowerCase();
            const rel = (t.rel || "").toLowerCase();
            if (target !== "_blank" && !rel.includes("popup")) {
              return;
            }

            try {
              const parsed = new URL(t.href, window.location.href);
              if (SAFE_HOSTS.has(parsed.hostname.toLowerCase())) {
                return; // allow safe host popups
              }
            } catch {
              // fall through
            }

            e.preventDefault();
            console.warn("Blocked popup click:", t.href);
          },
          true
        );
      })();

      const VIEW_STORAGE_KEY = "channel-picker-active-view";
      const STREAM_SANDBOX_ATTR = "allow-scripts allow-same-origin allow-presentation";
      const STREAM_IFRAME_ALLOW = "autoplay; encrypted-media; picture-in-picture";
      let activeView = "videos";
      let activeStreamState = null;

      const cache = {
        videos: [],
        currentVideoId: null,
        streams: [],
        currentStreamId: null,
        todaysGames: [],
        gamesDate: null,
        currentNbaGame: null
      };

      async function requestJson(url, options) {
        const res = await fetch(url, options);
        const data = await res.json();
        if (!res.ok) {
          const err = new Error(data.error || "Request failed");
          err.response = data;
          throw err;
        }
        return data;
      }

      function persistActiveView(view) {
        try {
          localStorage.setItem(VIEW_STORAGE_KEY, view);
        } catch (err) {
          console.warn("Unable to store view preference", err);
        }
      }

      function loadStoredView() {
        try {
          const stored = localStorage.getItem(VIEW_STORAGE_KEY);
          if (stored === "videos" || stored === "streams") {
            activeView = stored;
          }
        } catch (err) {
          console.warn("Unable to read view preference", err);
        }
      }

      /**
       * Get game status based on start time
       * @param {string} gameDate - Date in YYYY-MM-DD format
       * @param {string} gameTime - Time in 24h format (e.g., "19:30")
       * @returns {string} 'late' (>3hrs ago), 'live' (<3hrs ago), or 'upcoming'
       */
      function getGameStatus(gameDate, gameTime) {
        if (!gameDate || !gameTime) return 'upcoming';
        
        try {
          // Parse game start time in Eastern Time
          const [hours, minutes] = gameTime.split(':').map(Number);
          
          // Create date object for game start (Eastern Time)
          // We'll compare using current Eastern time
          const now = new Date();
          const etFormatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/New_York',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            hour12: false
          });
          
          const etParts = etFormatter.formatToParts(now);
          const etNow = {
            year: parseInt(etParts.find(p => p.type === 'year').value),
            month: parseInt(etParts.find(p => p.type === 'month').value),
            day: parseInt(etParts.find(p => p.type === 'day').value),
            hour: parseInt(etParts.find(p => p.type === 'hour').value),
            minute: parseInt(etParts.find(p => p.type === 'minute').value)
          };
          
          // Parse game date
          const [gameYear, gameMonth, gameDay] = gameDate.split('-').map(Number);
          
          // Calculate minutes since midnight for comparison
          const nowMinutes = etNow.hour * 60 + etNow.minute;
          const gameMinutes = hours * 60 + minutes;
          
          // Check if game is on the same day
          const sameDay = etNow.year === gameYear && 
                          etNow.month === gameMonth && 
                          etNow.day === gameDay;
          
          if (!sameDay) {
            // Game is on a different day
            const gameDateTime = new Date(gameYear, gameMonth - 1, gameDay, hours, minutes);
            const nowDateTime = new Date(etNow.year, etNow.month - 1, etNow.day, etNow.hour, etNow.minute);
            
            if (gameDateTime > nowDateTime) {
              return 'upcoming';
            }
            // Game was on a previous day
            const hoursSinceStart = (nowDateTime - gameDateTime) / (1000 * 60 * 60);
            return hoursSinceStart > 3 ? 'late' : 'live';
          }
          
          // Same day - compare times
          const minutesSinceStart = nowMinutes - gameMinutes;
          
          if (minutesSinceStart < 0) {
            return 'upcoming';  // Game hasn't started yet
          } else if (minutesSinceStart > 180) {
            return 'late';      // Started more than 3 hours ago
          } else {
            return 'live';      // Started within last 3 hours
          }
        } catch (err) {
          console.error('Error calculating game status:', err);
          return 'upcoming';
        }
      }

      function addAdBlockOverlays(container) {
        // Remove existing overlays first
        container.querySelectorAll('.adBlockOverlay').forEach(el => el.remove());

        // Create overlay elements that block clicks on common ad positions
        const positions = [
          'adBlockTop',
          'adBlockBottom',
          'adBlockTopLeft',
          'adBlockTopRight',
          'adBlockBottomLeft',
          'adBlockBottomRight'
        ];

        positions.forEach(pos => {
          const overlay = document.createElement('div');
          overlay.className = `adBlockOverlay ${pos}`;
          // Block clicks and prevent them from reaching ads
          overlay.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            console.log('Ad click blocked');
          });
          container.appendChild(overlay);
        });
      }

      function configureStreamIframe(iframe, { sandboxed = true } = {}) {
        if (!iframe) return;
        if (sandboxed) {
          iframe.setAttribute("sandbox", STREAM_SANDBOX_ATTR);
        } else {
          iframe.removeAttribute("sandbox");
        }

        const existingAllow = iframe.getAttribute("allow") || "";
        const features = new Set(
          existingAllow
            .split(";")
            .map(item => item.trim())
            .filter(Boolean)
        );
        STREAM_IFRAME_ALLOW.split(";").forEach(item => {
          const trimmed = item.trim();
          if (trimmed) features.add(trimmed);
        });
        iframe.setAttribute("allow", Array.from(features).join("; "));

        iframe.setAttribute("allowfullscreen", "");
        if (!iframe.getAttribute("referrerpolicy")) {
          iframe.setAttribute("referrerpolicy", "no-referrer");
        }
      }

      function getStatusEl(view) {
        if (view === "streams") return document.getElementById("statusStreams");
        return document.getElementById("statusVideos");
      }

      function setStatus(view, msg, good = true) {
        const el = getStatusEl(view);
        if (!el) return;
        el.style.color = good ? "#9ef59e" : "#ff6b6b";
        el.textContent = msg;
      }

      function sanitizeEmbed(html, { sandboxed = true } = {}) {
        if (typeof html !== "string") return "";
        const template = document.createElement("template");
        template.innerHTML = html;
        template.content.querySelectorAll("script").forEach(node => node.remove());
        template.content.querySelectorAll("*").forEach(node => {
          [...node.attributes].forEach(attr => {
            if (attr.name.toLowerCase().startsWith("on")) {
              node.removeAttribute(attr.name);
            }
          });
        });
        template.content.querySelectorAll("iframe").forEach(node =>
          configureStreamIframe(node, { sandboxed })
        );
        return template.innerHTML;
      }

      function setVideoPlayer(video) {
        const frame = document.getElementById("playerFrame");
        const streamContainer = document.getElementById("streamPlayer");
        const titleEl = document.getElementById("overlayTitle");
        const nowPlayingEl = document.getElementById("nowPlayingMeta");

        streamContainer.innerHTML = "";
        streamContainer.classList.add("hiddenFrame");
        activeStreamState = null;
        frame.classList.remove("hiddenFrame");

        if (video) {
          const embedUrl = `https://www.youtube.com/embed/${video.ytId}?autoplay=1&rel=0`;
          if (frame.src !== embedUrl) {
            frame.src = embedUrl;
          }
          titleEl.textContent = video.title;
          nowPlayingEl.textContent = video.title;
        } else {
          frame.removeAttribute("src");
          titleEl.textContent = "No video selected yet.";
          nowPlayingEl.textContent = "Add a link to start playing.";
        }
      }

      function setStreamPlayer(stream) {
        const frame = document.getElementById("playerFrame");
        const streamContainer = document.getElementById("streamPlayer");
        const titleEl = document.getElementById("overlayTitle");
        const nowPlayingEl = document.getElementById("nowPlayingMeta");

        frame.removeAttribute("src");
        frame.classList.add("hiddenFrame");
        streamContainer.classList.remove("hiddenFrame");

        if (!stream) {
          streamContainer.innerHTML = "";
          titleEl.textContent = "Select a game to watch";
          nowPlayingEl.textContent = "Click a game above to start.";
          activeStreamState = null;
          return;
        }

        const sandboxed = stream.sandboxed !== false;
        const nextState = {
          id: stream.id,
          sandboxed,
          embedSrc: stream.embedSrc || null,
          embedCode: stream.embedCode || ""
        };

        const unchanged =
          activeStreamState &&
          activeStreamState.id === nextState.id &&
          activeStreamState.sandboxed === nextState.sandboxed &&
          activeStreamState.embedSrc === nextState.embedSrc &&
          (!nextState.embedSrc && activeStreamState.embedCode === nextState.embedCode);

        if (unchanged) {
          return;
        }

        streamContainer.innerHTML = "";

        if (nextState.embedSrc) {
          const iframe = document.createElement("iframe");
          iframe.src = nextState.embedSrc;
          configureStreamIframe(iframe, { sandboxed });
          streamContainer.appendChild(iframe);
        } else {
          streamContainer.innerHTML = sanitizeEmbed(nextState.embedCode, { sandboxed });
          streamContainer.querySelectorAll("iframe").forEach(node =>
            configureStreamIframe(node, { sandboxed })
          );
        }

        // Add ad-blocking overlays
        addAdBlockOverlays(streamContainer);

        titleEl.textContent = stream.title;
        nowPlayingEl.textContent = stream.title;
        activeStreamState = nextState;
      }

      function renderVideoList(videos, currentId) {
        const listEl = document.getElementById("videoList");
        listEl.innerHTML = "";

        if (!videos.length) {
          const empty = document.createElement("div");
          empty.className = "emptyState";
          empty.textContent = "No videos yet. Paste a YouTube link above to start.";
          listEl.appendChild(empty);
          return;
        }

        videos.forEach(video => {
          const row = document.createElement("div");
          row.className = "videoListItem";

          const meta = document.createElement("div");
          meta.className = "videoMeta";

          const title = document.createElement("div");
          title.className = "videoTitle";
          title.textContent = video.title;

          if (video.id === currentId) {
            const tag = document.createElement("span");
            tag.className = "currentTag";
            tag.textContent = "PLAYING";
            title.appendChild(tag);
          }

          const url = document.createElement("div");
          url.className = "videoUrl";
          url.textContent = video.url;

          meta.appendChild(title);
          meta.appendChild(url);

          const actions = document.createElement("div");
          actions.className = "actions";

          const selectBtn = document.createElement("button");
          selectBtn.className = "selectBtn";
          selectBtn.textContent = "Play";
          selectBtn.onclick = () => selectVideo(video.id);

          const delBtn = document.createElement("button");
          delBtn.className = "deleteBtn";
          delBtn.textContent = "Delete";
          delBtn.onclick = () => deleteVideo(video.id);

          actions.appendChild(selectBtn);
          actions.appendChild(delBtn);

          row.appendChild(meta);
          row.appendChild(actions);

          listEl.appendChild(row);
        });
      }

      function renderStreamList(streams, currentId) {
        const listEl = document.getElementById("streamList");
        listEl.innerHTML = "";

        if (!streams.length) {
          const empty = document.createElement("div");
          empty.className = "emptyState";
          empty.textContent = "No streams saved yet. Click a game above to start watching.";
          listEl.appendChild(empty);
          return;
        }

        streams.forEach(stream => {
          const row = document.createElement("div");
          row.className = "videoListItem";

          const meta = document.createElement("div");
          meta.className = "videoMeta";

          const title = document.createElement("div");
          title.className = "videoTitle";
          title.textContent = stream.title;

          if (stream.id === currentId) {
            const tag = document.createElement("span");
            tag.className = "currentTag";
            tag.textContent = "ACTIVE";
            title.appendChild(tag);
          }

          const url = document.createElement("div");
          url.className = "videoUrl";
          url.textContent = stream.embedSrc || "Custom embed snippet saved.";

          meta.appendChild(title);
          meta.appendChild(url);

          if (stream.network || Number.isFinite(stream.viewers)) {
            const details = document.createElement("div");
            details.className = "streamInfoLine";
            const parts = [];
            if (stream.network) parts.push(stream.network);
            if (Number.isFinite(stream.viewers)) parts.push(`${stream.viewers} watching`);
            details.textContent = parts.join(" · ");
            meta.appendChild(details);
          }

          if (stream.sourceUrl) {
            const srcLine = document.createElement("div");
            srcLine.className = "streamInfoLine";
            try {
              const parsed = new URL(stream.sourceUrl);
              srcLine.textContent = `Source: ${parsed.pathname}`;
            } catch {
              srcLine.textContent = `Source: ${stream.sourceUrl}`;
            }
            meta.appendChild(srcLine);
          }

          const sandboxInfo = document.createElement("div");
          sandboxInfo.className = "streamInfoLine";
          sandboxInfo.textContent = stream.sandboxed !== false
            ? "Popup protection: ON"
            : "Popup protection: OFF";
          meta.appendChild(sandboxInfo);

          const actions = document.createElement("div");
          actions.className = "actions";

          const selectBtn = document.createElement("button");
          selectBtn.className = "selectBtn";
          selectBtn.textContent = "Show";
          selectBtn.onclick = () => selectStream(stream.id);

          const toggleSandboxBtn = document.createElement("button");
          toggleSandboxBtn.className = "secondary";
          const sandboxed = stream.sandboxed !== false;
          toggleSandboxBtn.textContent = sandboxed ? "Allow Popups" : "Block Popups";
          toggleSandboxBtn.onclick = () => updateStreamSandbox(stream.id, !sandboxed);

          const delBtn = document.createElement("button");
          delBtn.className = "deleteBtn";
          delBtn.textContent = "Delete";
          delBtn.onclick = () => deleteStream(stream.id);

          actions.appendChild(selectBtn);
          actions.appendChild(toggleSandboxBtn);
          actions.appendChild(delBtn);

          row.appendChild(meta);
          row.appendChild(actions);

          listEl.appendChild(row);
        });
      }

      async function refreshVideos({ silent = false } = {}) {
        try {
          const data = await requestJson("/api/videos");
          cache.videos = Array.isArray(data.videos) ? data.videos : [];
          cache.currentVideoId = typeof data.currentVideoId === "string" ? data.currentVideoId : null;
          renderVideoList(cache.videos, cache.currentVideoId);

          const current = cache.videos.find(video => video.id === cache.currentVideoId) || null;
          if (activeView === "videos") {
            setVideoPlayer(current);
          }

          if (!silent) {
            const message = current
              ? `Now playing: ${current.title}`
              : "Waiting for your first link.";
            setStatus("videos", message);
          }

          return data;
        } catch (err) {
          console.error(err);
          if (!silent) {
            setStatus("videos", err.message || "Failed to refresh videos.", false);
          }
          if (activeView === "videos") {
            setVideoPlayer(null);
          }
          throw err;
        }
      }

      async function refreshStreams({ silent = false } = {}) {
        try {
          const data = await requestJson("/api/streams");
          cache.streams = Array.isArray(data.streams) ? data.streams : [];
          cache.currentStreamId = typeof data.currentStreamId === "string" ? data.currentStreamId : null;
          renderStreamList(cache.streams, cache.currentStreamId);

          const current = cache.streams.find(stream => stream.id === cache.currentStreamId) || null;
          if (activeView === "streams") {
            setStreamPlayer(current);
          }

          if (!silent) {
            const message = current
              ? `Now streaming: ${current.title}`
              : "Click a game to start watching.";
            setStatus("streams", message);
          }

          return data;
        } catch (err) {
          console.error(err);
          if (!silent) {
            setStatus("streams", err.message || "Failed to refresh streams.", false);
          }
          if (activeView === "streams") {
            setStreamPlayer(null);
          }
          throw err;
        }
      }

      async function addVideo() {
        const urlInput = document.getElementById("newUrl");
        const rawUrl = urlInput.value.trim();

        if (!rawUrl) {
          setStatus("videos", "Please paste a YouTube URL.", false);
          return;
        }

        setStatus("videos", "Adding video…");

        try {
          await requestJson("/api/videos", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ url: rawUrl })
          });

          urlInput.value = "";
          await refreshVideos({ silent: true });
          setStatus("videos", "Video added and ready to play.");
        } catch (err) {
          console.error(err);
          setStatus("videos", err.message || "Failed to add video.", false);
        }
      }

      async function selectVideo(id) {
        setStatus("videos", "Switching video…");
        try {
          await requestJson("/api/select", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id })
          });
          await refreshVideos({ silent: true });
          setStatus("videos", "Now playing updated.");
        } catch (err) {
          console.error(err);
          setStatus("videos", err.message || "Failed to switch video.", false);
        }
      }

      async function deleteVideo(id) {
        setStatus("videos", "Deleting…");
        try {
          await requestJson(`/api/videos/${id}`, { method: "DELETE" });
          await refreshVideos({ silent: true });
          setStatus("videos", "Deleted.");
        } catch (err) {
          console.error(err);
          setStatus("videos", err.message || "Failed to delete.", false);
        }
      }

      async function selectStream(id) {
        setStatus("streams", "Switching stream…");
        try {
          await requestJson("/api/streams/select", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id })
          });
          await refreshStreams({ silent: true });
          setStatus("streams", "Now streaming updated.");
          if (activeView === "streams") {
            updatePlayerForActiveView();
          }
        } catch (err) {
          console.error(err);
          setStatus("streams", err.message || "Failed to switch stream.", false);
        }
      }

      async function updateStreamSandbox(id, sandboxed) {
        setStatus(
          "streams",
          sandboxed ? "Enabling popup protection…" : "Allowing popups for this stream…"
        );
        try {
          await requestJson(`/api/streams/${id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sandboxed })
          });
          await refreshStreams({ silent: true });
          setStatus(
            "streams",
            sandboxed ? "Popup protection enabled." : "Popup protection disabled."
          );
          if (activeView === "streams") {
            updatePlayerForActiveView();
          }
        } catch (err) {
          console.error(err);
          setStatus(
            "streams",
            err.message || "Failed to update popup protection.",
            false
          );
        }
      }

      async function deleteStream(id) {
        setStatus("streams", "Deleting stream…");
        try {
          await requestJson(`/api/streams/${id}`, { method: "DELETE" });
          await refreshStreams({ silent: true });
          setStatus("streams", "Stream removed.");
          if (activeView === "streams") {
            updatePlayerForActiveView();
          }
        } catch (err) {
          console.error(err);
          setStatus("streams", err.message || "Failed to delete stream.", false);
        }
      }

      // NBA Today's Games Functions
      async function fetchTodaysGames({ silent = false } = {}) {
        try {
          const data = await requestJson("/api/nba-today");
          cache.todaysGames = Array.isArray(data.games) ? data.games : [];
          cache.gamesDate = data.date || null;
          renderTodaysGames();
          
          if (!silent && cache.todaysGames.length > 0) {
            setStatus("streams", `${cache.todaysGames.length} NBA games today. Click to watch.`);
          } else if (!silent && cache.todaysGames.length === 0) {
            setStatus("streams", "No NBA games scheduled for today.");
          }
          
          return data;
        } catch (err) {
          console.error("Failed to fetch today's games:", err);
          if (!silent) {
            setStatus("streams", "Could not load today's games.", false);
          }
          renderTodaysGames(); // Render empty state
          throw err;
        }
      }

      function renderTodaysGames() {
        const container = document.getElementById("todaysGames");
        if (!container) return;
        
        container.innerHTML = "";
        
        // Show date header
        if (cache.gamesDate) {
          const dateEl = document.createElement("div");
          dateEl.className = "gamesDate";
          const dateObj = new Date(cache.gamesDate + "T12:00:00");
          dateEl.textContent = dateObj.toLocaleDateString("en-US", {
            weekday: "long",
            month: "short",
            day: "numeric"
          });
          container.appendChild(dateEl);
        }
        
        if (!cache.todaysGames.length) {
          const empty = document.createElement("div");
          empty.className = "noGames";
          empty.textContent = "No games scheduled for today.";
          container.appendChild(empty);
          return;
        }
        
        const grid = document.createElement("div");
        grid.className = "gamesGrid";
        
        cache.todaysGames.forEach(game => {
          const card = document.createElement("div");
          card.className = "gameCard";
          
          // Check if this game is currently playing in our player
          const gameId = `nba-${game.date}-${game.away}-${game.home}`;
          if (cache.currentNbaGame === gameId) {
            card.classList.add("playing");
          }
          
          // Calculate game status based on start time
          const gameStatus = getGameStatus(game.date, game.time);
          if (gameStatus === 'late') {
            card.classList.add("gameLate");
          } else if (gameStatus === 'live') {
            card.classList.add("gameLive");
          }
          
          const away = document.createElement("div");
          away.className = "gameTeams";
          away.textContent = game.awayName;
          
          const at = document.createElement("div");
          at.className = "gameAt";
          at.textContent = "@";
          
          const home = document.createElement("div");
          home.className = "gameTeams";
          home.textContent = game.homeName;
          
          card.appendChild(away);
          card.appendChild(at);
          card.appendChild(home);
          
          // Show start time if available
          if (game.startTime) {
            const time = document.createElement("div");
            time.className = "gameTime";
            time.textContent = game.startTime;
            card.appendChild(time);
          }
          
          card.onclick = () => playNbaGame(game);
          
          grid.appendChild(card);
        });
        
        container.appendChild(grid);
      }

      function playNbaGame(game) {
        // Directly play the game without saving to database
        // Construct a stream object on the fly
        const stream = {
          id: `nba-${game.date}-${game.away}-${game.home}`,
          title: game.title,
          embedSrc: game.embedSrc,
          embedCode: game.embedCode,
          sandboxed: false  // modistreams needs full permissions to work
        };
        
        // Track currently playing game for UI highlighting
        cache.currentNbaGame = stream.id;
        
        // Play directly
        setStreamPlayer(stream);
        setStatus("streams", `Now playing: ${game.title}`);
        renderTodaysGames(); // Update playing state
      }

      function setupVideoControls() {
        const urlInput = document.getElementById("newUrl");
        urlInput.addEventListener("keydown", evt => {
          if (evt.key === "Enter") {
            evt.preventDefault();
            addVideo();
          }
        });

        document.getElementById("addBtn").addEventListener("click", addVideo);
      }

      function setupStreamControls() {
        // Fetch today's NBA games on setup
        fetchTodaysGames({ silent: false }).catch(() => {});
      }

      function setupCommonControls() {
        document.getElementById("refreshBtn").addEventListener("click", () => {
          refreshActive({ silent: false }).catch(() => {});
        });

        document.getElementById("fullscreenBtn").addEventListener("click", () => {
          if (activeView === "streams") {
            const container = document.getElementById("streamPlayer");
            const iframe = container.querySelector("iframe");
            const target = iframe || container;
            if (target.requestFullscreen) {
              target.requestFullscreen();
            } else if (target.webkitRequestFullscreen) {
              target.webkitRequestFullscreen();
            }
          } else {
            const frame = document.getElementById("playerFrame");
            if (frame.requestFullscreen) {
              frame.requestFullscreen();
            } else if (frame.webkitRequestFullscreen) {
              frame.webkitRequestFullscreen();
            }
          }
        });
      }

      function setupViewTabs() {
        const tabs = document.querySelectorAll(".viewTab");
        tabs.forEach(tab => {
          tab.classList.toggle("active", tab.dataset.view === activeView);
          tab.addEventListener("click", () => {
            setActiveView(tab.dataset.view);
          });
        });
      }

      function syncViewVisibility() {
        document.getElementById("videoControls").classList.toggle("hidden", activeView !== "videos");
        document.getElementById("streamControls").classList.toggle("hidden", activeView !== "streams");
      }

      function updatePlayerForActiveView() {
        if (activeView === "streams") {
          const current = cache.streams.find(stream => stream.id === cache.currentStreamId) || null;
          setStreamPlayer(current);
        } else {
          const current = cache.videos.find(video => video.id === cache.currentVideoId) || null;
          setVideoPlayer(current);
        }
      }

      function refreshActive({ silent = false } = {}) {
        if (activeView === "streams") {
          return refreshStreams({ silent });
        }
        return refreshVideos({ silent });
      }

      function setActiveView(view) {
        if (view !== "videos" && view !== "streams") {
          return;
        }

        if (view === activeView) {
          return;
        }

        activeView = view;
        persistActiveView(view);

        document.querySelectorAll(".viewTab").forEach(tab => {
          tab.classList.toggle("active", tab.dataset.view === view);
        });

        syncViewVisibility();
        updatePlayerForActiveView();
        refreshActive({ silent: false })
          .catch(() => {})
          .finally(updatePlayerForActiveView);
      }

      window.addEventListener("DOMContentLoaded", () => {
        loadStoredView();
        setupViewTabs();
        setupVideoControls();
        setupStreamControls();
        setupCommonControls();
        syncViewVisibility();

        setStatus("streams", "Loading today's games…");

        refreshVideos({ silent: false })
          .catch(() => {})
          .finally(updatePlayerForActiveView);
        refreshStreams({ silent: true }).catch(() => {});
      });
    </script>
  </head>
  <body>
    <header>Channel Picker</header>
    <div id="viewTabs">
      <button type="button" class="viewTab" data-view="videos">YouTube Playlist</button>
      <button type="button" class="viewTab" data-view="streams">Live Streams</button>
    </div>
    <div id="layout">
      <section id="playerCard" class="card">
        <div id="playerWrapper">
          <div id="overlayTitle"></div>
          <iframe
            id="playerFrame"
            allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            frameborder="0"
            referrerpolicy="strict-origin-when-cross-origin"
          ></iframe>
          <div id="streamPlayer" class="hiddenFrame"></div>
        </div>
        <div id="playerActions">
          <span><strong>Now Playing:</strong> <span id="nowPlayingMeta">Loading…</span></span>
          <button id="refreshBtn" class="secondary">Refresh</button>
          <button id="fullscreenBtn" class="secondary">Fullscreen</button>
        </div>
      </section>

      <section id="controls" class="card">
        <div id="videoControls">
          <div id="statusVideos" class="statusLine"></div>

          <div class="panelTitle">Add a YouTube link</div>
          <input
            id="newUrl"
            type="text"
            placeholder="https://www.youtube.com/watch?v=..."
            autocomplete="off"
          />
          <button id="addBtn">Add Video</button>

          <div class="panelTitle" style="margin-top:1.4rem;">Playlist</div>
          <div id="videoList"></div>
        </div>

        <div id="streamControls" class="hidden">
          <div id="statusStreams" class="statusLine"></div>

          <div class="panelTitle">Today's NBA Games</div>
          <div id="todaysGames"></div>

          <div class="panelTitle" style="margin-top:1.4rem;">Saved Streams</div>
          <div id="streamList"></div>
        </div>
      </section>
    </div>
  </body>
</html>
